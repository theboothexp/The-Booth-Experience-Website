<!DOCTYPE HTML>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Thanks — The Booth Experience</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
	<style>
		:root{--cream:#f4f3ec;--ink:#1b1b18;--ink-soft:#3a3a34;--gold:#9c7c48;}
		*{box-sizing:border-box;margin:0;padding:0}
		body{
			font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--ink);
			min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;
		}
		.card{max-width:34rem}
		.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:1rem}
		h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(2.4rem,6vw,3.6rem);line-height:1.05;letter-spacing:-0.015em}
		p{margin:1.4rem 0 2rem;font-size:1.1rem;color:var(--ink-soft)}
		.btn{
			display:inline-block;border:1.5px solid var(--ink);padding:.85rem 1.7rem;
			font-weight:600;text-decoration:none;color:var(--cream);background:var(--ink);
			transition:background .2s,border-color .2s;
		}
		.btn:hover{background:var(--gold);border-color:var(--gold);color:#fff}
	</style>
</head>
<body>
	<div class="card">
		<p class="eyebrow">The Booth Experience</p>
		<h1>Thanks — we’ve got it.</h1>
		<p>Your booking request is in. We’ll get back to you soon with availability and a quote. Talk shortly!</p>
		<a href="/" class="btn">Back to home</a>
	</div>
</body>
</html>
